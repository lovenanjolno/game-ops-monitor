sources:
  google_play:
    enabled: true
    targets:
    - id: com.supercell.clashroyale
      name: 部落冲突
      country: cn
      lang: zh
      limit: 20
      days: 7
      notes: ''
      enabled: true
    - id: com.supercell.brawlstars
      name: 荒野乱斗
      country: cn
      lang: zh
      limit: 20
      days: 7
      notes: ''
      enabled: false
  discord:
    enabled: false
    targets: []
llm:
  provider: minimax
  api_key_env: MINIMAX_API_KEY
  base_url_env: MINIMAX_BASE_URL
  model: MiniMax-M2.5
  temperature: 0.1
  max_concurrent: 5
  batch_size: 10
fetch:
  default_limit: 50
  max_limit: 500
  rate_limit_per_minute: 30
storage:
  db_path: data/monitor.db
classification:
  min_urgency_to_alert: 4
  skip_non_complaints: true
